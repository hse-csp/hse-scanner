<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تاریخچه بازرسی‌ها</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Tahoma, Arial, sans-serif; background: #f0f2f5; min-height: 100vh; padding: 16px; }
    .header { background: #1e3c72; color: #fff; padding: 16px; border-radius: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; }
    .header .user { font-size: 13px; opacity: 0.9; }
    .header-btns { display: flex; gap: 8px; }
    .header-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .stat-card { background: #fff; border-radius: 12px; padding: 14px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-card .num { font-size: 24px; font-weight: bold; margin-bottom: 4px; }
    .stat-card .label { font-size: 12px; color: #666; }
    .stat-card.total .num { color: #1e3c72; }
    .stat-card.approved .num { color: #4caf50; }
    .stat-card.rejected .num { color: #d32f2f; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card h2 { font-size: 16px; color: #1e3c72; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .card h2 .count { font-size: 14px; color: #999; font-weight: normal; }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
    .filter-btn { padding: 8px 16px; background: #f5f5f5; border: 2px solid #e0e0e0; border-radius: 20px; font-family: inherit; font-size: 13px; font-weight: bold; color: #555; cursor: pointer; white-space: nowrap; }
    .filter-btn.active { background: #1e3c72; color: #fff; border-color: #1e3c72; }
    .history-item { background: #f9f9f9; border: 2px solid #e0e0e0; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .history-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
    .history-title { flex: 1; }
    .history-title .barcode { font-size: 15px; font-weight: bold; color: #222; }
    .history-title .meta { font-size: 12px; color: #777; margin-top: 4px; }
    .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; white-space: nowrap; }
    .status-badge.pending { background: #fff3e0; color: #e65100; }
    .status-badge.approved { background: #e8f5e9; color: #2e7d32; }
    .status-badge.rejected { background: #ffebee; color: #c62828; }
    .final-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-top: 6px; }
    .final-badge.salem { background: #e8f5e9; color: #2e7d32; }
    .final-badge.defective { background: #ffebee; color: #c62828; }
    .final-badge.repairs { background: #fff3e0; color: #e65100; }
    .rejection-note { background: #ffebee; border-right: 3px solid #d32f2f; padding: 8px 12px; border-radius: 6px; font-size: 12px; color: #c62828; margin-top: 8px; }
    .view-btn { width: 100%; padding: 10px; background: #1e3c72; color: #fff; border: none; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .empty-msg { text-align: center; color: #999; padding: 30px; font-size: 14px; }
    .loading-box { text-align: center; padding: 40px 20px; color: #666; font-size: 15px; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.show { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 20px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal img { width: 100%; border-radius: 8px; margin-bottom: 12px; display: block; }
    .modal h3 { font-size: 16px; color: #1e3c72; margin-bottom: 12px; }
    .modal .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid #eee; }
    .modal .row:last-child { border-bottom: none; }
    .modal .row .l { color: #666; }
    .modal .row .v { font-weight: bold; color: #222; }
    .modal-close { width: 100%; padding: 12px; background: #1e3c72; color: #fff; border: none; border-radius: 8px; font-family: inherit; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 16px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>تاریخچه بازرسی‌ها</h1>
      <div class="user" id="userInfo"></div>
    </div>
    <div class="header-btns">
      <button class="header-btn" onclick="goToScanner()">اسکنر</button>
      <button class="header-btn" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card total">
      <div class="num" id="countTotal">۰</div>
      <div class="label">کل بازرسی‌ها</div>
    </div>
    <div class="stat-card approved">
      <div class="num" id="countApproved">۰</div>
      <div class="label">تأیید شده</div>
    </div>
    <div class="stat-card rejected">
      <div class="num" id="countRejected">۰</div>
      <div class="label">رد شده</div>
    </div>
  </div>

  <div class="card">
    <h2>
      <span>۳ ماه گذشته</span>
      <span class="count" id="historyCountLabel"></span>
    </h2>

    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-filter="all" onclick="applyFilter('all', this)">همه</button>
      <button class="filter-btn" data-filter="pending" onclick="applyFilter('pending', this)">در انتظار</button>
      <button class="filter-btn" data-filter="approved" onclick="applyFilter('approved', this)">تأیید شده</button>
      <button class="filter-btn" data-filter="rejected" onclick="applyFilter('rejected', this)">رد شده</button>
    </div>

    <div id="loadingBox" class="loading-box">در حال بارگذاری...</div>
    <div id="historyList"></div>
    <div id="emptyBox" class="empty-msg" style="display:none;">هیچ بازرسی‌ای در ۳ ماه گذشته ثبت نشده است.</div>
  </div>

  <div class="modal-overlay" id="viewModal">
    <div class="modal">
      <h3>جزئیات بازرسی</h3>
      <img id="modalPhoto" src="" alt="عکس بازرسی" style="display:none;">
      <div id="modalDetails"></div>
      <button class="modal-close" onclick="closeViewModal()">بستن</button>
    </div>
  </div>

  <script>
    var EXEC_URL = 'https://script.google.com/macros/s/AKfycbzwCIuePkj1LOuoTMs_3IZMaOsIuLidRDFU6MERh6LTDCyLOVdnv_00vGS-1L0-OnxA/exec';
    var INDEX_URL = 'index.html';
    var currentToken = '';
    var currentUser = '';
    var allHistory = [];
    var activeFilter = 'all';

    function goToLogin() {
      window.location.href = EXEC_URL + '?page=Login';
    }

    function goToScanner() {
      window.location.href = INDEX_URL;
    }

    function handleSessionExpired() {
      localStorage.clear();
      sessionStorage.clear();
      goToLogin();
    }

    function apiCall(request) {
      return fetch(EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(request),
        redirect: 'follow'
      }).then(function(r) { return r.json(); });
    }

    (function initPage() {
      currentToken = localStorage.getItem('token') || '';
      currentUser = localStorage.getItem('fullName') || localStorage.getItem('username') || '';

      if (!currentToken) { goToLogin(); return; }

      apiCall({ action: 'auth.me', token: currentToken }).then(function(response) {
        if (!response.success) {
          handleSessionExpired();
          return;
        }
        document.getElementById('userInfo').textContent = currentUser;
        loadHistory();
      }).catch(function() {
        handleSessionExpired();
      });
    })();

    function doLogout() {
      var token = currentToken;
      localStorage.clear();
      sessionStorage.clear();
      fetch(EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'auth.logout', token: token }),
        redirect: 'follow'
      }).finally(function() {
        goToLogin();
      });
    }

    function toFa(n) {
      return String(n).replace(/\d/g, function(d) {
        return '۰۱۲۳۴۵۶۷۸۹'[d];
      });
    }

    function loadHistory() {
      apiCall({
        action: 'inspection.history',
        token: currentToken,
        payload: {}
      }).then(function(response) {
        document.getElementById('loadingBox').style.display = 'none';

        if (!response.success) {
          if (response.error && (response.error.indexOf('نشست') !== -1 || response.error.indexOf('منقضی') !== -1)) {
            handleSessionExpired();
            return;
          }
          alert('خطا: ' + response.error);
          return;
        }

        allHistory = response.data.inspections || [];
        updateStats();
        renderHistory();
      }).catch(function(err) {
        document.getElementById('loadingBox').style.display = 'none';
        alert('خطا در ارتباط با سرور: ' + err.message);
      });
    }

    function updateStats() {
      var total = allHistory.length;
      var approved = 0;
      var rejected = 0;

      allHistory.forEach(function(item) {
        if (item.status === 'approved') approved++;
        else if (item.status === 'rejected') rejected++;
      });

      document.getElementById('countTotal').textContent = toFa(total);
      document.getElementById('countApproved').textContent = toFa(approved);
      document.getElementById('countRejected').textContent = toFa(rejected);
    }

    function applyFilter(filter, btn) {
      activeFilter = filter;
      var buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      renderHistory();
    }

    function renderHistory() {
      var container = document.getElementById('historyList');
      container.innerHTML = '';

      var filtered = allHistory;
      if (activeFilter !== 'all') {
        filtered = allHistory.filter(function(item) {
          return item.status === activeFilter;
        });
      }

      if (filtered.length === 0) {
        document.getElementById('emptyBox').style.display = 'block';
        document.getElementById('historyCountLabel').textContent = '';
        return;
      }

      document.getElementById('emptyBox').style.display = 'none';
      document.getElementById('historyCountLabel').textContent = toFa(filtered.length) + ' مورد';

      filtered.forEach(function(item) {
        container.appendChild(createHistoryCard(item));
      });
    }

    function createHistoryCard(item) {
      var div = document.createElement('div');
      div.className = 'history-item';

      var header = document.createElement('div');
      header.className = 'history-header';

      var title = document.createElement('div');
      title.className = 'history-title';

      var bc = document.createElement('div');
      bc.className = 'barcode';
      bc.textContent = item.barcode + (item.source === 'firebox' ? ' (فایر باکس)' : '');
      title.appendChild(bc);

      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = formatDate(item.date);
      title.appendChild(meta);

      var finalLabels = {
        'salem': 'سالم',
        'defective': 'معیوب',
        'needsRepair': 'نیاز به اصلاح'
      };
      var finalClasses = {
        'salem': 'salem',
        'defective': 'defective',
        'needsRepair': 'repairs'
      };
      var fbadge = document.createElement('span');
      fbadge.className = 'final-badge ' + (finalClasses[item.finalStatus] || '');
      fbadge.textContent = 'نتیجه: ' + (finalLabels[item.finalStatus] || item.finalStatus);
      title.appendChild(fbadge);

      header.appendChild(title);

      var statusLabels = {
        'pending': 'در انتظار',
        'approved': 'تأیید شده',
        'rejected': 'رد شده'
      };
      var sbadge = document.createElement('span');
      sbadge.className = 'status-badge ' + item.status;
      sbadge.textContent = statusLabels[item.status] || item.status;
      header.appendChild(sbadge);

      div.appendChild(header);

      if (item.status === 'rejected' && item.rejectionReason) {
        var note = document.createElement('div');
        note.className = 'rejection-note';
        note.textContent = 'دلیل رد: ' + item.rejectionReason;
        div.appendChild(note);
      }

      var viewBtn = document.createElement('button');
      viewBtn.className = 'view-btn';
      viewBtn.textContent = 'مشاهده جزئیات';
      viewBtn.onclick = function() { openViewModal(item); };
      div.appendChild(viewBtn);

      return div;
    }

    function formatDate(dateVal) {
      if (!dateVal) return '-';
      try {
        var d = new Date(dateVal);
        var y = d.getFullYear();
        var m = ('0' + (d.getMonth() + 1)).slice(-2);
        var day = ('0' + d.getDate()).slice(-2);
        var hh = ('0' + d.getHours()).slice(-2);
        var mm = ('0' + d.getMinutes()).slice(-2);
        return y + '/' + m + '/' + day + ' - ' + hh + ':' + mm;
      } catch (e) {
        return String(dateVal);
      }
    }

    function convertDriveLink(url) {
      if (!url) return '';
      var match = url.match(/[?&]id=([^&]+)/);
      if (match) {
        return 'https://lh3.googleusercontent.com/d/' + match[1];
      }
      return url;
    }

    function openViewModal(item) {
      var photo = document.getElementById('modalPhoto');
      if (item.photoUrl) {
        photo.src = convertDriveLink(item.photoUrl);
        photo.style.display = 'block';
      } else {
        photo.style.display = 'none';
      }

      var details = document.getElementById('modalDetails');
      details.innerHTML = '';
      appendRow(details, 'کد تجهیز', item.barcode);
      appendRow(details, 'نوع', item.source === 'firebox' ? 'فایر باکس' : 'سیلندر');
      appendRow(details, 'تاریخ', formatDate(item.date));
      appendRow(details, 'نتیجه نهایی', item.finalStatus);
      appendRow(details, 'وضعیت', item.status);

      if (item.status === 'approved' && item.approvedBy) {
        appendRow(details, 'تأییدکننده', item.approvedBy);
      }
      if (item.status === 'rejected' && item.rejectionReason) {
        appendRow(details, 'دلیل رد', item.rejectionReason);
      }
      if (item.notes) {
        appendRow(details, 'یادداشت', item.notes);
      }

      document.getElementById('viewModal').classList.add('show');
    }

    function appendRow(parent, label, value) {
      var row = document.createElement('div');
      row.className = 'row';
      var l = document.createElement('span'); l.className = 'l'; l.textContent = label;
      var v = document.createElement('span'); v.className = 'v'; v.textContent = String(value);
      row.appendChild(l); row.appendChild(v); parent.appendChild(row);
    }

    function closeViewModal() {
      document.getElementById('viewModal').classList.remove('show');
    }
  </script>

</body>
</html>
