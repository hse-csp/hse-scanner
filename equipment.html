<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت تجهیزات</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Tahoma, Arial, sans-serif; background: #f0f2f5; min-height: 100vh; padding: 16px; }
    .header { background: #1e3c72; color: #fff; padding: 16px; border-radius: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .header h1 { font-size: 18px; }
    .header .user { font-size: 13px; opacity: 0.9; }
    .header-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .header-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13px; }
    .header-btn:hover { background: rgba(255,255,255,0.3); }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; background: #fff; padding: 8px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .tab { flex: 1; padding: 12px; background: #f5f5f5; border: none; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: bold; color: #555; cursor: pointer; }
    .tab.active { background: #1e3c72; color: #fff; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .toolbar .search-input { flex: 1; min-width: 200px; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: inherit; font-size: 14px; }
    .toolbar .search-input:focus { outline: none; border-color: #2a5298; }
    .add-btn { background: #4caf50; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .add-btn:hover { background: #388e3c; }
    .checkbox-wrap { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; }
    .checkbox-wrap input { width: 16px; height: 16px; }
    .bulk-panel { background: #e8f5e9; border: 2px solid #4caf50; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
    .bulk-panel h3 { font-size: 14px; color: #2e7d32; margin-bottom: 12px; }
    .bulk-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
    .bulk-filters .filter-group { flex: 1; min-width: 180px; }
    .bulk-filters label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; font-weight: bold; }
    .bulk-filters select, .bulk-filters input { width: 100%; padding: 10px 12px; border: 2px solid #c8e6c9; border-radius: 8px; font-family: inherit; font-size: 13px; background: #fff; }
    .bulk-filters select:focus, .bulk-filters input:focus { outline: none; border-color: #4caf50; }
    .bulk-filters button { padding: 10px 20px; background: #4caf50; color: #fff; border: none; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; height: 42px; }
    .bulk-filters button:hover { background: #388e3c; }
    .bulk-filters button:disabled { background: #ccc; cursor: not-allowed; }
    .equipment-list { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 600px) { .equipment-list { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 900px) { .equipment-list { grid-template-columns: 1fr 1fr 1fr; } }
    .equip-card { background: #f9f9f9; border: 2px solid #e0e0e0; border-radius: 10px; padding: 14px; }
    .equip-card.inactive { opacity: 0.6; background: #f0f0f0; }
    .equip-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
    .equip-barcode { font-size: 16px; font-weight: bold; color: #222; }
    .equip-row { font-size: 13px; color: #555; padding: 3px 0; }
    .equip-row .label { color: #888; }
    .badge { padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; }
    .badge.active { background: #e8f5e9; color: #2e7d32; }
    .badge.maintenance { background: #fff3e0; color: #e65100; }
    .badge.retired { background: #ffebee; color: #c62828; }
    .badge.cyl-CO2 { background: #e3f2fd; color: #0d47a1; }
    .badge.cyl-powder { background: #fff3e0; color: #e65100; }
    .badge.cyl-water { background: #e3f2fd; color: #1565c0; }
    .badge.firebox { background: #ffebee; color: #b71c1c; }
    .equip-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .btn { padding: 8px 12px; border: none; border-radius: 6px; font-family: inherit; font-size: 12px; font-weight: bold; cursor: pointer; }
    .btn-edit { background: #2a5298; color: #fff; }
    .btn-status { background: #f57c00; color: #fff; }
    .btn-delete { background: #d32f2f; color: #fff; }
    .empty-msg { text-align: center; color: #999; padding: 30px; font-size: 14px; }
    .loading-box { text-align: center; padding: 40px 20px; color: #666; font-size: 15px; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.show { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 20px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-size: 16px; color: #1e3c72; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: bold; color: #333; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: inherit; font-size: 14px; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #2a5298; }
    .modal-btns { display: flex; gap: 8px; margin-top: 16px; }
    .modal-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-family: inherit; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-cancel { background: #e0e0e0; color: #333; }
    .btn-confirm { background: #1e3c72; color: #fff; }
    .btn-danger { background: #d32f2f; color: #fff; }
    .error-msg { color: #d32f2f; font-size: 13px; margin-top: 8px; display: none; background: #ffebee; padding: 8px 12px; border-radius: 6px; }
    .warning-box { background: #fff3e0; border-right: 4px solid #ff9800; padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; color: #e65100; }
    .info-box { background: #e3f2fd; border-right: 4px solid #1e3c72; padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; color: #0d47a1; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>مدیریت تجهیزات</h1>
      <div class="user" id="userInfo"></div>
    </div>
    <div class="header-btns">
      <button class="header-btn" onclick="window.location.href='index.html'">اسکنر</button>
      <button class="header-btn" onclick="window.location.href='dashboard.html'">داشبورد</button>
      <button class="header-btn" onclick="window.location.href='users.html'">کاربران</button>
      <button class="header-btn" onclick="window.location.href='logs.html'">لاگ‌ها</button>
      <button class="header-btn" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabCylinders" onclick="switchTab('cylinder')">سیلندرها</button>
    <button class="tab" id="tabFireboxes" onclick="switchTab('firebox')">فایر باکس‌ها</button>
  </div>

  <div class="bulk-panel">
    <h3>تخصیص دسته‌ای</h3>
    <div class="bulk-filters">
      <div class="filter-group">
        <label>کارخانه</label>
        <select id="bulkPlant">
          <option value="">همه کارخانه‌ها</option>
        </select>
      </div>
      <div class="filter-group">
        <label>بازرس فعلی</label>
        <select id="bulkCurrentInspector">
          <option value="">همه بازرس‌ها</option>
        </select>
      </div>
      <div class="filter-group">
        <label>بازرس جدید (شماره پرسنلی)</label>
        <input type="text" id="bulkNewInspector" placeholder="مثال: 1002" inputmode="numeric">
      </div>
      <button onclick="openBulkAssignModal()">تخصیص دسته‌ای</button>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <input type="text" class="search-input" id="searchInput" placeholder="جستجو در کد یا موقعیت..." oninput="renderList()">
      <label class="checkbox-wrap">
        <input type="checkbox" id="showInactive" onchange="loadAll()">
        <span>نمایش غیرفعال‌ها</span>
      </label>
      <button class="add-btn" onclick="openAddModal()">+ افزودن</button>
    </div>

    <div id="loadingBox" class="loading-box">در حال بارگذاری...</div>
    <div id="equipmentList" class="equipment-list"></div>
    <div id="emptyBox" class="empty-msg" style="display:none;">موردی یافت نشد.</div>
  </div>

  <!-- Edit/Add Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3 id="modalTitle">افزودن تجهیز</h3>

      <div class="form-group" id="barcodeGroup">
        <label>بارکد *</label>
        <input type="text" id="inputBarcode" placeholder="مثال: CO2-001">
      </div>

      <div class="form-group" id="cylinderTypeGroup">
        <label>نوع سیلندر *</label>
        <select id="inputCylinderType">
          <option value="CO2">CO2</option>
          <option value="powder">پودری</option>
          <option value="water">آب</option>
        </select>
      </div>

      <div class="form-group">
        <label>موقعیت *</label>
        <input type="text" id="inputLocation" placeholder="مثال: سالن تولید A">
      </div>

      <div class="form-group">
        <label>کارخانه</label>
        <input type="text" id="inputPlant" placeholder="مثال: کارخانه مرکزی">
      </div>

      <div class="form-group" id="capacityGroup">
        <label>ظرفیت (برای سیلندر)</label>
        <input type="text" id="inputCapacity" placeholder="مثال: 5" inputmode="numeric">
      </div>

      <div class="form-group">
        <label>بازرس مسئول (شماره پرسنلی)</label>
        <input type="text" id="inputAssignedTo" placeholder="مثال: 1001" inputmode="numeric">
      </div>

      <div class="error-msg" id="modalError"></div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal('editModal')">لغو</button>
        <button class="btn-confirm" id="modalConfirmBtn" onclick="submitForm()">ذخیره</button>
      </div>
    </div>
  </div>

  <!-- Status Modal -->
  <div class="modal-overlay" id="statusModal">
    <div class="modal">
      <h3>تغییر وضعیت تجهیز</h3>
      <div class="form-group">
        <label>وضعیت جدید *</label>
        <select id="inputStatus">
          <option value="active">فعال</option>
          <option value="maintenance">تعمیر</option>
          <option value="retired">اسقاط</option>
        </select>
      </div>
      <div class="error-msg" id="statusError"></div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal('statusModal')">لغو</button>
        <button class="btn-confirm" onclick="submitStatus()">ذخیره</button>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3>حذف تجهیز</h3>
      <div class="warning-box">
        ⚠️ آیا از حذف کامل این تجهیز مطمئن هستید؟<br>
        این عملیات <b>قابل بازگشت نیست</b> و تاریخچه بازرسی‌های قبلی آن باقی می‌ماند.
      </div>
      <div id="deleteDetails" style="font-size:14px;color:#555;margin-bottom:12px;"></div>
      <div class="error-msg" id="deleteError"></div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal('deleteModal')">لغو</button>
        <button class="btn-danger" onclick="confirmDelete()">حذف کامل</button>
      </div>
    </div>
  </div>

  <!-- Bulk Assign Modal -->
  <div class="modal-overlay" id="bulkModal">
    <div class="modal">
      <h3>تأیید تخصیص دسته‌ای</h3>
      <div class="info-box" id="bulkSummary"></div>
      <div class="form-group">
        <label>بازرس جدید (شماره پرسنلی) *</label>
        <input type="text" id="confirmNewInspector" placeholder="مثال: 1002" inputmode="numeric">
      </div>
      <div class="error-msg" id="bulkError"></div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal('bulkModal')">لغو</button>
        <button class="btn-confirm" onclick="executeBulkAssign()">تأیید و اعمال</button>
      </div>
    </div>
  </div>

  <script>
    var EXEC_URL = 'https://script.google.com/macros/s/AKfycbzwCIuePkj1LOuoTMs_3IZMaOsIuLidRDFU6MERh6LTDCyLOVdnv_00vGS-1L0-OnxA/exec';
    var currentToken = '';
    var currentUser = '';
    var currentTab = 'cylinder';
    var cylindersList = [];
    var fireboxesList = [];
    var editingMode = 'add';
    var editingItem = null;
    var deleteTarget = null;
    var statusTarget = null;

    function goToLogin() {
      window.location.href = EXEC_URL + '?page=Login';
    }

    function handleSessionExpired() {
      localStorage.clear();
      sessionStorage.clear();
      goToLogin();
    }

    function apiCall(request) {
      return fetch(EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(request),
        redirect: 'follow'
      }).then(function(r) { return r.json(); });
    }

    (function initPage() {
      currentToken = localStorage.getItem('token') || '';
      currentUser = localStorage.getItem('fullName') || localStorage.getItem('username') || '';

      if (!currentToken) { goToLogin(); return; }

      apiCall({ action: 'auth.me', token: currentToken }).then(function(response) {
        if (!response.success) {
          handleSessionExpired();
          return;
        }
        var role = response.data.role;
        if (role !== 'admin') {
          alert('شما به این بخش دسترسی ندارید.');
          window.location.href = 'index.html';
          return;
        }
        document.getElementById('userInfo').textContent = currentUser;
        loadAll();
        loadFilters();
      }).catch(function() {
        handleSessionExpired();
      });
    })();

    function doLogout() {
      var token = currentToken;
      localStorage.clear();
      sessionStorage.clear();
      fetch(EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'auth.logout', token: token }),
        redirect: 'follow'
      }).finally(function() {
        goToLogin();
      });
    }

    function loadAll() {
      document.getElementById('loadingBox').style.display = 'block';
      document.getElementById('equipmentList').innerHTML = '';
      document.getElementById('emptyBox').style.display = 'none';

      var includeInactive = document.getElementById('showInactive').checked;

      apiCall({
        action: 'equipment.getAll',
        token: currentToken,
        payload: { includeInactive: includeInactive }
      }).then(function(response) {
        document.getElementById('loadingBox').style.display = 'none';

        if (!response.success) {
          if (response.error && (response.error.indexOf('نشست') !== -1 || response.error.indexOf('منقضی') !== -1)) {
            handleSessionExpired();
            return;
          }
          alert('خطا: ' + response.error);
          return;
        }

        cylindersList = response.data.cylinders || [];
        fireboxesList = response.data.fireboxes || [];
        renderList();
      }).catch(function(err) {
        document.getElementById('loadingBox').style.display = 'none';
        alert('خطا: ' + err.message);
      });
    }

    function loadFilters() {
      apiCall({
        action: 'equipment.getFilters',
        token: currentToken,
        payload: { kind: currentTab }
      }).then(function(response) {
        if (!response.success) return;

        var plantSelect = document.getElementById('bulkPlant');
        var inspSelect = document.getElementById('bulkCurrentInspector');

        plantSelect.innerHTML = '<option value="">همه کارخانه‌ها</option>';
        inspSelect.innerHTML = '<option value="">همه بازرس‌ها</option>';

        (response.data.plants || []).forEach(function(p) {
          var opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p;
          plantSelect.appendChild(opt);
        });

        (response.data.inspectors || []).forEach(function(i) {
          var opt = document.createElement('option');
          opt.value = i;
          opt.textContent = i;
          inspSelect.appendChild(opt);
        });
      }).catch(function() {});
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabCylinders').classList.toggle('active', tab === 'cylinder');
      document.getElementById('tabFireboxes').classList.toggle('active', tab === 'firebox');

      // Reset filters for this tab
      document.getElementById('bulkPlant').value = '';
      document.getElementById('bulkCurrentInspector').value = '';
      document.getElementById('bulkNewInspector').value = '';

      renderList();
      loadFilters();
    }

    function renderList() {
      var container = document.getElementById('equipmentList');
      container.innerHTML = '';

      var list = currentTab === 'cylinder' ? cylindersList : fireboxesList;
      var search = (document.getElementById('searchInput').value || '').trim().toLowerCase();

      if (search) {
        list = list.filter(function(item) {
          var bc = String(item.Barcode || '').toLowerCase();
          var loc = String(item.Location || '').toLowerCase();
          var plant = String(item.Plant || '').toLowerCase();
          return bc.indexOf(search) !== -1 || loc.indexOf(search) !== -1 || plant.indexOf(search) !== -1;
        });
      }

      if (list.length === 0) {
        document.getElementById('emptyBox').style.display = 'block';
        return;
      }

      document.getElementById('emptyBox').style.display = 'none';

      list.forEach(function(item) {
        container.appendChild(createEquipmentCard(item));
      });
    }

    function createEquipmentCard(item) {
      var kind = currentTab;
      var div = document.createElement('div');
      div.className = 'equip-card';
      if (item.Status && item.Status !== 'active') div.className += ' inactive';

      var header = document.createElement('div');
      header.className = 'equip-header';

      var barcode = document.createElement('div');
      barcode.className = 'equip-barcode';
      barcode.textContent = item.Barcode || '-';
      header.appendChild(barcode);

      var badge = document.createElement('span');
      var statusLabels = { active: 'فعال', maintenance: 'تعمیر', retired: 'اسقاط' };
      badge.className = 'badge ' + (item.Status || 'active');
      badge.textContent = statusLabels[item.Status] || item.Status || 'فعال';
      header.appendChild(badge);

      div.appendChild(header);

      if (kind === 'cylinder' && item.CylinderType) {
        var tb = document.createElement('span');
        var typeLabels = { 'CO2': 'CO2', 'powder': 'پودری', 'water': 'آب' };
        tb.className = 'badge cyl-' + item.CylinderType;
        tb.textContent = typeLabels[item.CylinderType] || item.CylinderType;
        div.appendChild(tb);
      }
      if (kind === 'firebox') {
        var fbb = document.createElement('span');
        fbb.className = 'badge firebox';
        fbb.textContent = 'فایر باکس';
        div.appendChild(fbb);
      }

      appendRow(div, 'موقعیت', item.Location || '-');
      if (item.Plant) appendRow(div, 'کارخانه', item.Plant);
      if (kind === 'cylinder' && item.Capacity) appendRow(div, 'ظرفیت', item.Capacity);
      if (item.AssignedTo) appendRow(div, 'بازرس', item.AssignedTo);
      if (item.LastInspection) appendRow(div, 'آخرین بازرسی', formatDate(item.LastInspection));

      var actions = document.createElement('div');
      actions.className = 'equip-actions';

      var editBtn = document.createElement('button');
      editBtn.className = 'btn btn-edit';
      editBtn.textContent = 'ویرایش';
      editBtn.onclick = function() { openEditModal(item); };
      actions.appendChild(editBtn);

      var statusBtn = document.createElement('button');
      statusBtn.className = 'btn btn-status';
      statusBtn.textContent = 'تغییر وضعیت';
      statusBtn.onclick = function() { openStatusModal(item); };
      actions.appendChild(statusBtn);

      var deleteBtn = document.createElement('button');
      deleteBtn.className = 'btn btn-delete';
      deleteBtn.textContent = 'حذف';
      deleteBtn.onclick = function() { openDeleteModal(item); };
      actions.appendChild(deleteBtn);

      div.appendChild(actions);
      return div;
    }

    function appendRow(parent, label, value) {
      var row = document.createElement('div');
      row.className = 'equip-row';
      var l = document.createElement('span'); l.className = 'label'; l.textContent = label + ': ';
      var v = document.createElement('span'); v.textContent = String(value);
      row.appendChild(l); row.appendChild(v); parent.appendChild(row);
    }

    function formatDate(dv) {
      if (!dv) return '-';
      try {
        var d = new Date(dv);
        var y = d.getFullYear();
        var m = ('0' + (d.getMonth() + 1)).slice(-2);
        var day = ('0' + d.getDate()).slice(-2);
        return y + '/' + m + '/' + day;
      } catch(e) { return String(dv); }
    }

    function openModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    function openAddModal() {
      editingMode = 'add';
      editingItem = null;

      document.getElementById('modalTitle').textContent =
        currentTab === 'cylinder' ? 'افزودن سیلندر جدید' : 'افزودن فایر باکس جدید';
      document.getElementById('modalConfirmBtn').textContent = 'افزودن';
      document.getElementById('barcodeGroup').style.display = 'block';
      document.getElementById('inputBarcode').value = '';
      document.getElementById('inputBarcode').disabled = false;

      if (currentTab === 'cylinder') {
        document.getElementById('cylinderTypeGroup').style.display = 'block';
        document.getElementById('inputCylinderType').value = 'CO2';
        document.getElementById('capacityGroup').style.display = 'block';
        document.getElementById('inputCapacity').value = '';
      } else {
        document.getElementById('cylinderTypeGroup').style.display = 'none';
        document.getElementById('capacityGroup').style.display = 'none';
      }

      document.getElementById('inputLocation').value = '';
      document.getElementById('inputPlant').value = '';
      document.getElementById('inputAssignedTo').value = '';
      document.getElementById('modalError').style.display = 'none';

      openModal('editModal');
    }

    function openEditModal(item) {
      editingMode = 'edit';
      editingItem = item;

      document.getElementById('modalTitle').textContent = 'ویرایش تجهیز';
      document.getElementById('modalConfirmBtn').textContent = 'ذخیره';

      document.getElementById('barcodeGroup').style.display = 'block';
      document.getElementById('inputBarcode').value = item.Barcode || '';
      document.getElementById('inputBarcode').disabled = true;

      if (currentTab === 'cylinder') {
        document.getElementById('cylinderTypeGroup').style.display = 'block';
        document.getElementById('inputCylinderType').value = item.CylinderType || 'CO2';
        document.getElementById('capacityGroup').style.display = 'block';
        document.getElementById('inputCapacity').value = item.Capacity || '';
      } else {
        document.getElementById('cylinderTypeGroup').style.display = 'none';
        document.getElementById('capacityGroup').style.display = 'none';
      }

      document.getElementById('inputLocation').value = item.Location || '';
      document.getElementById('inputPlant').value = item.Plant || '';
      document.getElementById('inputAssignedTo').value = item.AssignedTo || '';
      document.getElementById('modalError').style.display = 'none';

      openModal('editModal');
    }

    function openStatusModal(item) {
      statusTarget = item;
      document.getElementById('inputStatus').value = item.Status || 'active';
      document.getElementById('statusError').style.display = 'none';
      openModal('statusModal');
    }

    function openDeleteModal(item) {
      deleteTarget = item;
      document.getElementById('deleteDetails').textContent =
        'کد: ' + item.Barcode + ' | موقعیت: ' + (item.Location || '-');
      document.getElementById('deleteError').style.display = 'none';
      openModal('deleteModal');
    }

    function openBulkAssignModal() {
      var plant = document.getElementById('bulkPlant').value;
      var current = document.getElementById('bulkCurrentInspector').value;
      var newInsp = document.getElementById('bulkNewInspector').value.trim();

      var errEl = document.getElementById('bulkError');
      errEl.style.display = 'none';

      if (!plant && !current) {
        alert('حداقل یکی از فیلترها (کارخانه یا بازرس فعلی) را انتخاب کنید.');
        return;
      }
      if (!newInsp) {
        alert('شماره پرسنلی بازرس جدید را وارد کنید.');
        return;
      }

      // Count matching equipment
      var list = currentTab === 'cylinder' ? cylindersList : fireboxesList;
      var count = 0;
      list.forEach(function(item) {
        var itemPlant = String(item.Plant || '').trim();
        var itemAssign = String(item.AssignedTo || '').trim();
        var matchPlant = plant ? (itemPlant === plant) : true;
        var matchAssigned = current ? (itemAssign === current) : true;
        if (matchPlant && matchAssigned) count++;
      });

      var summary = '';
      summary += 'تعداد تجهیزات مطابق فیلتر: <b>' + count + '</b><br>';
      if (plant) summary += 'کارخانه: <b>' + plant + '</b><br>';
      if (current) summary += 'بازرس فعلی: <b>' + current + '</b><br>';
      summary += 'بازرس جدید: <b>' + newInsp + '</b>';

      document.getElementById('bulkSummary').innerHTML = summary;
      document.getElementById('confirmNewInspector').value = newInsp;

      openModal('bulkModal');
    }

    function executeBulkAssign() {
      var plant = document.getElementById('bulkPlant').value;
      var current = document.getElementById('bulkCurrentInspector').value;
      var newInsp = document.getElementById('confirmNewInspector').value.trim();
      var errEl = document.getElementById('bulkError');
      errEl.style.display = 'none';

      if (!newInsp) {
        errEl.textContent = 'شماره پرسنلی بازرس جدید اجباری است.';
        errEl.style.display = 'block';
        return;
      }

      if (!confirm('آیا از تخصیص دسته‌ای مطمئن هستید؟')) return;

      apiCall({
        action: 'equipment.bulkAssign',
        token: currentToken,
        payload: {
          kind: currentTab,
          plant: plant,
          currentAssignedTo: current,
          newAssignedTo: newInsp
        }
      }).then(function(response) {
        if (response.success) {
          closeModal('bulkModal');
          alert('تخصیص انجام شد. تعداد: ' + response.data.updated);
          document.getElementById('bulkNewInspector').value = '';
          loadAll();
          loadFilters();
        } else {
          errEl.textContent = response.error;
          errEl.style.display = 'block';
        }
      }).catch(function(err) {
        errEl.textContent = 'خطا: ' + err.message;
        errEl.style.display = 'block';
      });
    }

    function submitForm() {
      var barcode = document.getElementById('inputBarcode').value.trim();
      var location = document.getElementById('inputLocation').value.trim();
      var plant = document.getElementById('inputPlant').value.trim();
      var assignedTo = document.getElementById('inputAssignedTo').value.trim();
      var capacity = document.getElementById('inputCapacity').value.trim();
      var cylinderType = document.getElementById('inputCylinderType').value;
      var errEl = document.getElementById('modalError');
      errEl.style.display = 'none';

      if (!barcode || !location) {
        errEl.textContent = 'بارکد و موقعیت اجباری هستند.';
        errEl.style.display = 'block';
        return;
      }

      var payload = {
        barcode: barcode,
        kind: currentTab,
        location: location,
        plant: plant,
        assignedTo: assignedTo
      };

      if (currentTab === 'cylinder') {
        payload.capacity = capacity;
        payload.cylinderType = cylinderType;
      }

      var action = editingMode === 'add' ? 'equipment.create' : 'equipment.update';

      apiCall({
        action: action,
        token: currentToken,
        payload: payload
      }).then(function(response) {
        if (response.success) {
          closeModal('editModal');
          loadAll();
          loadFilters();
        } else {
          errEl.textContent = response.error;
          errEl.style.display = 'block';
        }
      }).catch(function(err) {
        errEl.textContent = 'خطا: ' + err.message;
        errEl.style.display = 'block';
      });
    }

    function submitStatus() {
      var newStatus = document.getElementById('inputStatus').value;
      var errEl = document.getElementById('statusError');
      errEl.style.display = 'none';

      if (!statusTarget) return;

      apiCall({
        action: 'equipment.toggleStatus',
        token: currentToken,
        payload: {
          barcode: statusTarget.Barcode,
          kind: currentTab,
          status: newStatus
        }
      }).then(function(response) {
        if (response.success) {
          closeModal('statusModal');
          statusTarget = null;
          loadAll();
        } else {
          errEl.textContent = response.error;
          errEl.style.display = 'block';
        }
      }).catch(function(err) {
        errEl.textContent = 'خطا: ' + err.message;
        errEl.style.display = 'block';
      });
    }

    function confirmDelete() {
      if (!deleteTarget) return;
      var errEl = document.getElementById('deleteError');
      errEl.style.display = 'none';

      apiCall({
        action: 'equipment.delete',
        token: currentToken,
        payload: {
          barcode: deleteTarget.Barcode,
          kind: currentTab
        }
      }).then(function(response) {
        if (response.success) {
          closeModal('deleteModal');
          deleteTarget = null;
          loadAll();
          loadFilters();
        } else {
          errEl.textContent = response.error;
          errEl.style.display = 'block';
        }
      }).catch(function(err) {
        errEl.textContent = 'خطا: ' + err.message;
        errEl.style.display = 'block';
      });
    }
  </script>

</body>
</html>
