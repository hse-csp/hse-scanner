<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد مدیر</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Tahoma, Arial, sans-serif; background: #f0f2f5; min-height: 100vh; padding: 16px; padding-bottom: 100px; }
    .header { background: #1e3c72; color: #fff; padding: 16px; border-radius: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; }
    .header .user { font-size: 13px; opacity: 0.9; }
    .header-btns { display: flex; gap: 8px; }
    .header-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .stat-card { background: #fff; border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-card .num { font-size: 28px; font-weight: bold; margin-bottom: 6px; }
    .stat-card .label { font-size: 13px; color: #666; }
    .stat-card.pending .num { color: #ff9800; }
    .stat-card.approved .num { color: #4caf50; }
    .stat-card.rejected .num { color: #d32f2f; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card h2 { font-size: 16px; color: #1e3c72; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .card h2 .count { font-size: 14px; color: #999; font-weight: normal; }
    .select-all-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f5f5f5; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
    .select-all-bar label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .select-all-bar input { width: 18px; height: 18px; }
    .batch-btn { padding: 10px 16px; background: #4caf50; color: #fff; border: none; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: bold; cursor: pointer; }
    .batch-btn:disabled { background: #ccc; cursor: not-allowed; }
    .inspection-item { background: #f9f9f9; border: 2px solid #e0e0e0; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .inspection-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .inspection-header input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0; }
    .inspection-title { flex: 1; }
    .inspection-title .barcode { font-size: 16px; font-weight: bold; color: #222; }
    .inspection-title .meta { font-size: 12px; color: #777; margin-top: 4px; }
    .final-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-top: 6px; }
    .final-badge.salem { background: #e8f5e9; color: #2e7d32; }
    .final-badge.defective { background: #ffebee; color: #c62828; }
    .final-badge.repairs { background: #fff3e0; color: #e65100; }
    .inspection-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: bold; cursor: pointer; min-width: 90px; }
    .btn-approve { background: #4caf50; color: #fff; }
    .btn-reject { background: #d32f2f; color: #fff; }
    .btn-view { background: #1e3c72; color: #fff; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .empty-msg { text-align: center; color: #999; padding: 30px; font-size: 14px; }
    .loading-box { text-align: center; padding: 40px 20px; color: #666; font-size: 15px; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.show { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 20px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal img { width: 100%; border-radius: 8px; margin-bottom: 12px; }
    .modal h3 { font-size: 16px; color: #1e3c72; margin-bottom: 12px; }
    .modal .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid #eee; }
    .modal .row:last-child { border-bottom: none; }
    .modal .row .l { color: #666; }
    .modal .row .v { font-weight: bold; color: #222; }
    .modal-close { width: 100%; padding: 12px; background: #1e3c72; color: #fff; border: none; border-radius: 8px; font-family: inherit; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 16px; }
    .reject-modal textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: inherit; font-size: 14px; min-height: 80px; resize: vertical; margin-bottom: 12px; }
    .reject-modal textarea:focus { outline: none; border-color: #d32f2f; }
    .reject-modal .reject-confirm { background: #d32f2f; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>داشبورد مدیر</h1>
      <div class="user" id="userInfo"></div>
    </div>
    <div class="header-btns">
      <button class="header-btn" onclick="goToScanner()">اسکنر</button>
      <button class="header-btn" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card pending">
      <div class="num" id="countPending">-</div>
      <div class="label">در انتظار تأیید</div>
    </div>
    <div class="stat-card approved">
      <div class="num" id="countApproved">-</div>
      <div class="label">تأیید شده</div>
    </div>
    <div class="stat-card rejected">
      <div class="num" id="countRejected">-</div>
      <div class="label">رد شده</div>
    </div>
  </div>

  <div class="card">
    <h2>
      <span>بازرسی‌های در انتظار تأیید</span>
      <span class="count" id="pendingCountLabel"></span>
    </h2>

    <div id="loadingBox" class="loading-box">در حال بارگذاری...</div>

    <div id="pendingContainer" style="display:none;">
      <div class="select-all-bar" id="selectAllBar">
        <label>
          <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)">
          <span>انتخاب همه</span>
        </label>
        <button class="batch-btn" id="batchApproveBtn" onclick="batchApprove()" disabled>تأیید موارد انتخابی</button>
      </div>
      <div id="inspectionsList"></div>
    </div>

    <div id="emptyBox" class="empty-msg" style="display:none;">هیچ بازرسی در انتظار تأیید وجود ندارد.</div>
  </div>

  <div class="modal-overlay" id="viewModal">
    <div class="modal">
      <h3>جزئیات بازرسی</h3>
      <img id="modalPhoto" src="" alt="عکس بازرسی" style="display:none;">
      <div id="modalDetails"></div>
      <button class="modal-close" onclick="closeViewModal()">بستن</button>
    </div>
  </div>

  <div class="modal-overlay" id="rejectModal">
    <div class="modal reject-modal">
      <h3>دلیل رد بازرسی</h3>
      <textarea id="rejectReason" placeholder="دلیل رد را وارد کنید (اختیاری)"></textarea>
      <div style="display:flex; gap:8px;">
        <button class="modal-close" style="flex:1; margin-top:0;" onclick="closeRejectModal()">لغو</button>
        <button class="modal-close reject-confirm" style="flex:1; margin-top:0;" onclick="confirmReject()">تأیید رد</button>
      </div>
    </div>
  </div>

  <script>
    var EXEC_URL = 'https://script.google.com/macros/s/AKfycbzwCIuePkj1LOuoTMs_3IZMaOsIuLidRDFU6MERh6LTDCyLOVdnv_00vGS-1L0-OnxA/exec';
    var INDEX_URL = 'index.html';
    var currentToken = '';
    var currentUser = '';
    var currentRole = '';
    var pendingList = [];
    var selectedIds = {};
    var rejectTargetId = null;

    function goToLogin() {
      window.location.href = EXEC_URL + '?page=Login';
    }

    function goToScanner() {
      window.location.href = INDEX_URL;
    }

    function handleSessionExpired() {
      localStorage.clear();
      sessionStorage.clear();
      goToLogin();
    }

    function apiCall(request) {
      return fetch(EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(request),
        redirect: 'follow'
      }).then(function(r) { return r.json(); });
    }

    (function initPage() {
      currentToken = localStorage.getItem('token') || '';
      currentUser = localStorage.getItem('fullName') || localStorage.getItem('username') || '';

      if (!currentToken) { goToLogin(); return; }

      // Server-side role verification
      apiCall({ action: 'auth.me', token: currentToken }).then(function(response) {
        if (!response.success) {
          handleSessionExpired();
          return;
        }

        currentRole = response.data.role;
        if (currentRole !== 'manager' && currentRole !== 'admin') {
          alert('شما به این بخش دسترسی ندارید.');
          goToScanner();
          return;
        }

        document.getElementById('userInfo').textContent = currentUser;
        loadCounts();
        loadPending();
      }).catch(function() {
        handleSessionExpired();
      });
    })();

    function doLogout() {
      var token = currentToken;
      localStorage.clear();
      sessionStorage.clear();
      fetch(EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'auth.logout', token: token }),
        redirect: 'follow'
      }).finally(function() {
        goToLogin();
      });
    }

    function loadCounts() {
      apiCall({
        action: 'dashboard.counts',
        token: currentToken
      }).then(function(response) {
        if (!response.success) {
          if (response.error && (response.error.indexOf('نشست') !== -1 || response.error.indexOf('منقضی') !== -1)) {
            handleSessionExpired();
            return;
          }
          console.error('loadCounts: ' + response.error);
          return;
        }
        document.getElementById('countPending').textContent = toFa(response.data.pending);
        document.getElementById('countApproved').textContent = toFa(response.data.approved);
        document.getElementById('countRejected').textContent = toFa(response.data.rejected);
      }).catch(function(err) {
        console.error('loadCounts failed: ' + err.message);
      });
    }

    function toFa(n) {
      return String(n).replace(/\d/g, function(d) {
        return '۰۱۲۳۴۵۶۷۸۹'[d];
      });
    }

    function loadPending() {
      apiCall({
        action: 'dashboard.pending',
        token: currentToken
      }).then(function(response) {
        document.getElementById('loadingBox').style.display = 'none';

        if (!response.success) {
          if (response.error && (response.error.indexOf('نشست') !== -1 || response.error.indexOf('منقضی') !== -1)) {
            handleSessionExpired();
            return;
          }
          alert('خطا: ' + response.error);
          return;
        }

        pendingList = response.data.inspections || [];
        renderPending();
      }).catch(function(err) {
        document.getElementById('loadingBox').style.display = 'none';
        alert('خطا در ارتباط با سرور: ' + err.message);
      });
    }

    function renderPending() {
      var container = document.getElementById('inspectionsList');
      container.innerHTML = '';
      selectedIds = {};
      document.getElementById('selectAllCheckbox').checked = false;

      if (pendingList.length === 0) {
        document.getElementById('pendingContainer').style.display = 'none';
        document.getElementById('emptyBox').style.display = 'block';
        document.getElementById('pendingCountLabel').textContent = '';
        return;
      }

      document.getElementById('pendingContainer').style.display = 'block';
      document.getElementById('emptyBox').style.display = 'none';
      document.getElementById('pendingCountLabel').textContent = toFa(pendingList.length) + ' مورد';

      pendingList.forEach(function(item) {
        container.appendChild(createInspectionCard(item));
      });

      updateBatchButton();
    }

    function createInspectionCard(item) {
      var div = document.createElement('div');
      div.className = 'inspection-item';
      div.dataset.id = item.inspectionId;

      var header = document.createElement('div');
      header.className = 'inspection-header';

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.dataset.id = item.inspectionId;
      cb.onchange = function() { toggleSelect(item.inspectionId, cb.checked); };
      header.appendChild(cb);

      var title = document.createElement('div');
      title.className = 'inspection-title';

      var bc = document.createElement('div');
      bc.className = 'barcode';
      bc.textContent = item.barcode + (item.source === 'firebox' ? ' (فایر باکس)' : '');
      title.appendChild(bc);

      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = 'بازرس: ' + item.inspector + ' | ' + formatDate(item.date);
      title.appendChild(meta);

      var finalLabels = {
        'salem': 'سالم',
        'defective': 'معیوب',
        'needsRepair': 'نیاز به اصلاح'
      };
      var finalClasses = {
        'salem': 'salem',
        'defective': 'defective',
        'needsRepair': 'repairs'
      };
      var badge = document.createElement('span');
      badge.className = 'final-badge ' + (finalClasses[item.finalStatus] || '');
      badge.textContent = 'نتیجه: ' + (finalLabels[item.finalStatus] || item.finalStatus);
      title.appendChild(badge);

      header.appendChild(title);
      div.appendChild(header);

      var actions = document.createElement('div');
      actions.className = 'inspection-actions';

      var viewBtn = document.createElement('button');
      viewBtn.className = 'btn btn-view';
      viewBtn.textContent = 'مشاهده';
      viewBtn.onclick = function() { openViewModal(item); };
      actions.appendChild(viewBtn);

      var approveBtn = document.createElement('button');
      approveBtn.className = 'btn btn-approve';
      approveBtn.textContent = 'تأیید';
      approveBtn.onclick = function() { singleApprove(item.inspectionId, approveBtn); };
      actions.appendChild(approveBtn);

      var rejectBtn = document.createElement('button');
      rejectBtn.className = 'btn btn-reject';
      rejectBtn.textContent = 'رد';
      rejectBtn.onclick = function() { openRejectModal(item.inspectionId); };
      actions.appendChild(rejectBtn);

      div.appendChild(actions);
      return div;
    }

    function formatDate(dateVal) {
      if (!dateVal) return '-';
      try {
        var d = new Date(dateVal);
        var y = d.getFullYear();
        var m = ('0' + (d.getMonth() + 1)).slice(-2);
        var day = ('0' + d.getDate()).slice(-2);
        var hh = ('0' + d.getHours()).slice(-2);
        var mm = ('0' + d.getMinutes()).slice(-2);
        return y + '/' + m + '/' + day + ' - ' + hh + ':' + mm;
      } catch (e) {
        return String(dateVal);
      }
    }

    function toggleSelect(id, checked) {
      if (checked) selectedIds[id] = true;
      else delete selectedIds[id];
      updateBatchButton();
    }

    function toggleSelectAll(checkbox) {
      var checkboxes = document.querySelectorAll('#inspectionsList input[type="checkbox"]');
      checkboxes.forEach(function(cb) {
        cb.checked = checkbox.checked;
        if (checkbox.checked) selectedIds[cb.dataset.id] = true;
        else delete selectedIds[cb.dataset.id];
      });
      updateBatchButton();
    }

    function updateBatchButton() {
      var count = Object.keys(selectedIds).length;
      var btn = document.getElementById('batchApproveBtn');
      btn.disabled = count === 0;
      btn.textContent = count > 0 ? 'تأیید موارد انتخابی (' + toFa(count) + ')' : 'تأیید موارد انتخابی';
    }

    function singleApprove(id, btn) {
      if (!confirm('این بازرسی تأیید شود؟')) return;

      btn.disabled = true;
      btn.textContent = '...';

      apiCall({
        action: 'inspection.approve',
        token: currentToken,
        payload: { inspectionId: id }
      }).then(function(response) {
        if (response.success) {
          removeFromList(id);
          loadCounts();
        } else {
          alert('خطا: ' + response.error);
          btn.disabled = false;
          btn.textContent = 'تأیید';
        }
      }).catch(function(err) {
        alert('خطا: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'تأیید';
      });
    }

    function openRejectModal(id) {
      rejectTargetId = id;
      document.getElementById('rejectReason').value = '';
      document.getElementById('rejectModal').classList.add('show');
    }

    function closeRejectModal() {
      rejectTargetId = null;
      document.getElementById('rejectModal').classList.remove('show');
    }

    function confirmReject() {
      if (!rejectTargetId) return;

      var reason = document.getElementById('rejectReason').value.trim();
      var id = rejectTargetId;
      closeRejectModal();

      apiCall({
        action: 'inspection.reject',
        token: currentToken,
        payload: { inspectionId: id, reason: reason }
      }).then(function(response) {
        if (response.success) {
          removeFromList(id);
          loadCounts();
        } else {
          alert('خطا: ' + response.error);
        }
      }).catch(function(err) {
        alert('خطا: ' + err.message);
      });
    }

    function batchApprove() {
      var ids = Object.keys(selectedIds);
      if (ids.length === 0) return;

      if (!confirm('تأیید ' + toFa(ids.length) + ' بازرسی؟')) return;

      var btn = document.getElementById('batchApproveBtn');
      btn.disabled = true;
      btn.textContent = 'در حال تأیید...';

      apiCall({
        action: 'inspection.batchApprove',
        token: currentToken,
        payload: { inspectionIds: ids }
      }).then(function(response) {
        if (response.success) {
          // Remove only successfully approved items
          response.data.approvedIds.forEach(function(id) {
            removeFromListNoRender(id);
          });
          renderPending();
          loadCounts();

          var msg = 'موفق: ' + toFa(response.data.approvedCount);
          if (response.data.failedCount > 0) {
            msg += ' | ناموفق: ' + toFa(response.data.failedCount);
          }
          alert(msg);
        } else {
          alert('خطا: ' + response.error);
          btn.disabled = false;
          updateBatchButton();
        }
      }).catch(function(err) {
        alert('خطا: ' + err.message);
        btn.disabled = false;
        updateBatchButton();
      });
    }

    function removeFromList(id) {
      pendingList = pendingList.filter(function(item) { return item.inspectionId !== id; });
      delete selectedIds[id];
      renderPending();
    }

    function removeFromListNoRender(id) {
      pendingList = pendingList.filter(function(item) { return item.inspectionId !== id; });
      delete selectedIds[id];
    }

    function openViewModal(item) {
      var photo = document.getElementById('modalPhoto');
      if (item.photoUrl) {
        photo.src = item.photoUrl;
        photo.style.display = 'block';
      } else {
        photo.style.display = 'none';
      }

      var details = document.getElementById('modalDetails');
      details.innerHTML = '';
      appendRow(details, 'کد تجهیز', item.barcode);
      appendRow(details, 'نوع', item.source === 'firebox' ? 'فایر باکس' : 'سیلندر');
      appendRow(details, 'بازرس', item.inspector);
      appendRow(details, 'تاریخ', formatDate(item.date));
      appendRow(details, 'نتیجه', item.finalStatus);
      if (item.notes) appendRow(details, 'یادداشت', item.notes);

      document.getElementById('viewModal').classList.add('show');
    }

    function appendRow(parent, label, value) {
      var row = document.createElement('div');
      row.className = 'row';
      var l = document.createElement('span'); l.className = 'l'; l.textContent = label;
      var v = document.createElement('span'); v.className = 'v'; v.textContent = String(value);
      row.appendChild(l); row.appendChild(v); parent.appendChild(row);
    }

    function closeViewModal() {
      document.getElementById('viewModal').classList.remove('show');
    }
  </script>

</body>
</html>
