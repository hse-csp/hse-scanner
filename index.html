<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3c72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HSE CSP">
  <title>اسکن تجهیز - HSE</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="offline.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Tahoma, Arial, sans-serif; background: #f0f2f5; min-height: 100vh; padding: 16px; }
    .header { background: #1e3c72; color: #fff; padding: 16px; border-radius: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .header h1 { font-size: 18px; }
    .header .user { font-size: 13px; opacity: 0.9; }
    .header-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .logout-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13px; }
    .logout-btn:hover { background: rgba(255,255,255,0.3); }
    .logout-btn.pending-active { background: #ff9800; }
    .pending-count { background: #fff; color: #ff9800; padding: 1px 6px; border-radius: 10px; font-size: 11px; font-weight: bold; margin-right: 4px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card h2 { font-size: 16px; color: #1e3c72; margin-bottom: 14px; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
    .divider { text-align: center; color: #999; margin: 20px 0; font-size: 13px; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #ddd; }
    .divider::before { right: 0; }
    .divider::after { left: 0; }
    .search-group { display: flex; gap: 8px; }
    .search-group input { flex: 1; padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; font-family: inherit; }
    .search-group input:focus { outline: none; border-color: #2a5298; }
    .search-group button { padding: 14px 20px; background: #1e3c72; color: #fff; border: none; border-radius: 10px; font-family: inherit; font-size: 15px; font-weight: bold; cursor: pointer; }
    .start-btn { width: 100%; padding: 14px; background: #2a5298; color: #fff; border: none; border-radius: 10px; font-family: inherit; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 12px; }
    .start-btn:disabled { background: #999; }

    /* Pending Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; z-index: 2000; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-size: 16px; color: #1e3c72; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .modal h3 .count-badge { background: #ff9800; color: #fff; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
    .pending-item { background: #fff8e1; border: 2px solid #ff9800; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .pending-item .barcode { font-weight: bold; color: #1e3c72; font-size: 14px; }
    .pending-item .meta { font-size: 12px; color: #666; margin-top: 4px; }
    .pending-item .status { font-size: 12px; color: #e65100; font-weight: bold; margin-top: 4px; }
    .pending-actions { display: flex; gap: 6px; margin-top: 10px; }
    .pending-actions button { flex: 1; padding: 8px; border: none; border-radius: 6px; font-family: inherit; font-size: 12px; font-weight: bold; cursor: pointer; }
    .btn-retry { background: #4caf50; color: #fff; }
    .btn-delete { background: #d32f2f; color: #fff; }
    .btn-close { width: 100%; padding: 12px; background: #e0e0e0; color: #333; border: none; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 12px; }
    .empty-pending { text-align: center; color: #999; padding: 30px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>اسکن تجهیز</h1>
      <div class="user" id="userInfo"></div>
    </div>
    <div class="header-btns">
      <button class="logout-btn" id="pendingBtn" onclick="openPendingModal()">
        ارسال‌های معلق <span class="pending-count" id="pendingCount" style="display:none;">0</span>
      </button>
      <button class="logout-btn" onclick="window.location.href='history.html'">تاریخچه</button>
      <button class="logout-btn" id="dashboardBtn" style="display:none;" onclick="window.location.href='dashboard.html'">داشبورد</button>
      <button class="logout-btn" id="reportBtn" style="display:none;" onclick="window.location.href='report.html'">گزارش</button>
      <button class="logout-btn" id="usersBtn" style="display:none;" onclick="window.location.href='users.html'">کاربران</button>
      <button class="logout-btn" id="equipmentBtn" style="display:none;" onclick="window.location.href='equipment.html'">تجهیزات</button>
      <button class="logout-btn" id="logsBtn" style="display:none;" onclick="window.location.href='logs.html'">لاگ‌ها</button>
      <button class="logout-btn" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <div class="card">
    <h2>اسکن با دوربین</h2>
    <div id="reader"></div>
    <button class="start-btn" id="startScanBtn" onclick="startScanner()">شروع اسکن</button>
  </div>

  <div class="card">
    <div class="divider">یا</div>
    <h2>جستجوی دستی</h2>
    <div class="search-group">
      <input type="text" id="manualInput" placeholder="کد تجهیز را وارد کنید">
      <button onclick="manualSearch()">جستجو</button>
    </div>
  </div>

  <!-- Pending Modal -->
  <div class="modal-overlay" id="pendingModal">
    <div class="modal">
      <h3>
        <span>ارسال‌های معلق (آفلاین)</span>
        <span class="count-badge" id="modalCount">0</span>
      </h3>
      <div id="pendingList"></div>
      <button class="btn-close" onclick="closePendingModal()">بستن</button>
    </div>
  </div>

  <script>
    var EXEC_URL = 'https://script.google.com/macros/s/AKfycbyh8ccieztX3ZkFF0IozE_beRcZja0BH8ieYbQ9qCL1tLDxkq2QB0Pz3JD4v0IRY6eo/exec';
    var currentToken = '';
    var currentUser = '';
    var html5QrCode = null;
    var isScanning = false;

    (function readTokenFromHash() {
      if (window.location.hash.indexOf('token=') !== -1) {
        var params = new URLSearchParams(window.location.hash.substring(1));
        localStorage.setItem('token', params.get('token') || '');
        localStorage.setItem('username', params.get('username') || '');
        localStorage.setItem('role', params.get('role') || '');
        localStorage.setItem('fullName', params.get('fullName') || '');
        history.replaceState(null, '', window.location.pathname);
      }
    })();

    function goToLogin() {
      window.location.href = EXEC_URL + '?page=Login';
    }

    (function initPage() {
      currentToken = localStorage.getItem('token');
      currentUser = localStorage.getItem('fullName') || localStorage.getItem('username');
      var role = localStorage.getItem('role') || '';

      if (!currentToken) { goToLogin(); return; }

      document.getElementById('userInfo').textContent = currentUser;

      if (role === 'manager' || role === 'admin') {
        document.getElementById('dashboardBtn').style.display = 'inline-block';
        document.getElementById('reportBtn').style.display = 'inline-block';
      }
      if (role === 'admin') {
        document.getElementById('usersBtn').style.display = 'inline-block';
        document.getElementById('equipmentBtn').style.display = 'inline-block';
        document.getElementById('logsBtn').style.display = 'inline-block';
      }

      bindEvents();
      updatePendingBadge();
      processPendingQueue();
    })();

    function bindEvents() {
      document.getElementById('manualInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') manualSearch();
      });
    }

    // ============================================
    // Pending queue helpers
    // ============================================
    function getPendingKeys() {
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('hse_pending_') === 0) keys.push(k);
      }
      return keys;
    }

    function updatePendingBadge() {
      var keys = getPendingKeys();
      var count = keys.length;
      var counterEl = document.getElementById('pendingCount');
      var btnEl = document.getElementById('pendingBtn');

      if (count === 0) {
        counterEl.style.display = 'none';
        btnEl.classList.remove('pending-active');
      } else {
        counterEl.textContent = count;
        counterEl.style.display = 'inline-block';
        btnEl.classList.add('pending-active');
      }
    }

    function processPendingQueue() {
      var keys = getPendingKeys();
      if (keys.length === 0) return;

      keys.forEach(function(key) {
        trySendFromLocalStorage(key);
      });

      if (typeof getPendingSubmissions === 'function') {
        getPendingSubmissions().then(function(items) {
          items.forEach(function(item) {
            if (item.retries > 5) return;
            fetch(EXEC_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(item.payload),
              redirect: 'follow'
            }).then(function(r) { return r.json(); }).then(function(res) {
              if (res.success) deletePendingSubmission(item.id);
              else incrementRetry(item.id);
            }).catch(function() { incrementRetry(item.id); });
          });
        }).catch(function() {});
      }
    }

    function trySendFromLocalStorage(key) {
      var raw = localStorage.getItem(key);
      if (!raw) return;

      var payload;
      try { payload = JSON.parse(raw); }
      catch (e) { localStorage.removeItem(key); return; }

      fetch(EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        redirect: 'follow'
      }).then(function(r) { return r.json(); }).then(function(res) {
        if (res.success) {
          localStorage.removeItem(key);
          updatePendingBadge();
        }
      }).catch(function() {
        // Keep in queue for retry
      });
    }

    // ============================================
    // Pending Modal
    // ============================================
    function openPendingModal() {
      renderPendingList();
      document.getElementById('pendingModal').classList.add('show');
    }

    function closePendingModal() {
      document.getElementById('pendingModal').classList.remove('show');
    }

    function renderPendingList() {
      var keys = getPendingKeys();
      var listEl = document.getElementById('pendingList');
      var modalCountEl = document.getElementById('modalCount');
      listEl.innerHTML = '';
      modalCountEl.textContent = keys.length;

      if (keys.length === 0) {
        listEl.innerHTML = '<div class="empty-pending">هیچ ارسال معلقی وجود ندارد. ✅</div>';
        return;
      }

      keys.sort().reverse(); // Newest first

      keys.forEach(function(key) {
        var raw = localStorage.getItem(key);
        if (!raw) return;

        var payload;
        try { payload = JSON.parse(raw); }
        catch (e) {
          localStorage.removeItem(key);
          return;
        }

        var inner = payload.payload || {};
        var div = document.createElement('div');
        div.className = 'pending-item';

        var barcodeEl = document.createElement('div');
        barcodeEl.className = 'barcode';
        barcodeEl.textContent = 'کد: ' + (inner.barcode || '?');
        div.appendChild(barcodeEl);

        var metaEl = document.createElement('div');
        metaEl.className = 'meta';
        metaEl.textContent = 'نتیجه: ' + (inner.finalStatus || '-') + ' | آیتم‌ها: ' + (inner.items ? inner.items.length : 0);
        div.appendChild(metaEl);

        var statusEl = document.createElement('div');
        statusEl.className = 'status';
        statusEl.textContent = '⏳ در انتظار ارسال';
        div.appendChild(statusEl);

        var actions = document.createElement('div');
        actions.className = 'pending-actions';

        var retryBtn = document.createElement('button');
        retryBtn.className = 'btn-retry';
        retryBtn.textContent = 'ارسال مجدد';
        retryBtn.onclick = function() {
          retryBtn.disabled = true;
          retryBtn.textContent = '...';
          fetch(EXEC_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
            redirect: 'follow'
          }).then(function(r) { return r.json(); }).then(function(res) {
            if (res.success) {
              localStorage.removeItem(key);
              renderPendingList();
              updatePendingBadge();
            } else {
              retryBtn.disabled = false;
              retryBtn.textContent = 'ارسال مجدد';
              alert('خطا: ' + res.error);
            }
          }).catch(function(err) {
            retryBtn.disabled = false;
            retryBtn.textContent = 'ارسال مجدد';
            alert('خطا در ارتباط: ' + err.message);
          });
        };
        actions.appendChild(retryBtn);

        var deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn-delete';
        deleteBtn.textContent = 'حذف';
        deleteBtn.onclick = function() {
          if (!confirm('این ارسال معلق حذف شود؟')) return;
          localStorage.removeItem(key);
          renderPendingList();
          updatePendingBadge();
        };
        actions.appendChild(deleteBtn);

        div.appendChild(actions);
        listEl.appendChild(div);
      });
    }

    // ============================================
    // Auth / Scan
    // ============================================
    function doLogout() {
      var token = currentToken;
      localStorage.clear();
      sessionStorage.clear();
      fetch(EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'auth.logout', token: token }),
        redirect: 'follow'
      }).finally(function() {
        goToLogin();
      });
    }

    function startScanner() {
      if (isScanning) return;

      var btn = document.getElementById('startScanBtn');
      btn.disabled = true;
      btn.textContent = 'در حال راه‌اندازی دوربین...';

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode('reader');
      }

      html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        function() {}
      ).then(function() {
        isScanning = true;
        btn.textContent = 'دوربین فعال است';
      }).catch(function(err) {
        btn.disabled = false;
        btn.textContent = 'شروع اسکن';
        alert('خطا در دسترسی به دوربین: ' + err);
      });
    }

    function stopScanner() {
      if (html5QrCode && isScanning) {
        html5QrCode.stop().then(function() {
          isScanning = false;
          var btn = document.getElementById('startScanBtn');
          btn.disabled = false;
          btn.textContent = 'شروع اسکن';
        });
      }
    }

    function onScanSuccess(decodedText) {
      stopScanner();
      goToChecklist(decodedText);
    }

    function manualSearch() {
      var input = document.getElementById('manualInput');
      var code = input.value.trim();
      if (!code) {
        alert('لطفاً کد تجهیز را وارد کنید.');
        return;
      }
      goToChecklist(code);
    }

    function goToChecklist(barcode) {
      sessionStorage.setItem('currentBarcode', barcode);
      window.location.href = 'checklist.html';
    }
  </script>

  <script src="pwa.js" defer></script>
</body>
</html>
